name: Monorepo CI

on: 
  pull_request:
    branches: [main]
  push: 
   branches: [main]

permission: 
  contents: read

concurrency: 
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs: 
  validate: Lint, type-check, build
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with: 
        version: 11.25.0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with: 
        node-version: 24
        cache: pnpm 
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Restore Turbo cache 
      uses: actions/cache@v4
      with: 
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo-json') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{hashFiles('pnpm-lock.yaml', 'turbo.json' )}}-
    
    - name: Lint
      run: pnpm exec turbo run list

    - name: Type-check 
      run: pnpm exec turbo run check-types
    
    - name: Production build 
      run: pnpm exec turbo run build